# MnInP2Te6 C++/OpenMP 最终版：矩形/纳米带/全周期，LLG 与 MC 共用配置。
# 修改本文件后无需重新编译。详细优先关系见 docs/PARAMETERS.md。
# 优先顺序：内置默认值 < 本文件 < 命令行；同一项重复出现时后者覆盖前者。
# engine 决定哪组算法参数生效。缓存优先于初态：有对应完整场点时直接读取。
# PBS 默认尊重 cpu_threads；qsub 的 RIBBON_ENGINE/THREADS/OUTPUT 会作为命令行覆盖。

# ==================== 1. 模拟方法：首先选择这一项 ====================
engine = llg                     # llg：随机 Heun 动力学；mc：Metropolis 蒙特卡洛

# ==================== 2. 材料：两种方法共用，能量单位 meV ====================
material_name = MnInP2Te6
lattice_constant_angstrom = 1    # Å，保持原程序数值；绘图坐标采用晶格单位
moment_muB = 4.2                 # μB，影响 Zeeman 能量及 LLG 有效场/热场换算
# tb2j_bonds = bonds.csv         # 可选；原始 TB2J 逐键表，设定后使用 LLG 逐键交换
J1_meV = 1.71                    # 第一近邻交换
J2_meV = -0.11                   # 第二近邻交换
J3_meV = -0.09                   # 第三近邻交换
lambda_meV = 0                   # 最近邻 Sz*Sz 交换各向异性
K_meV = -0.5125                  # 单离子各向异性，能量项 -K*Sz²，保留原符号
D_meV = 0.63
dmi_type = bloch                 # bloch：D 沿键；neel：D 沿 z×键方向
Kxy_meV = 0                      # LLG 专用磁电耦合；两者为零则电场无动力学作用
Kxz_meV = 0                      # MC 沿用原程序，不使用电场及这两个耦合项

# ==================== 3. 晶格尺寸与边界：两种方法共用 ====================
Nx = 256                        # x 方向格点数，>=3
Ny = 64                         # y 方向行数，>=3；y 周期时必须为偶数
boundary_x = open               # periodic 周期；open 自由开放（也接受 closed 别名）
boundary_y = open               # 独立设置；不跨开放边界连接，不固定边缘自旋
# Nx=Ny=L 且两方向 periodic，可进行与原方形程序对应的全周期模拟。

# ==================== 4. 初态、随机种子与已有构型复用 ====================
seed = 12345                    # 固定编译环境/线程数下可复现；跨语言或线程数不保证逐位相同
initial_state = random          # random / skyrmion / uniform / 构型.txt / 构型.npy
skyrmion_radius_sites = 8        # 仅 skyrmion 初态生效，半径单位 a
skyrmion_wall_sites = 2          # 仅 skyrmion 初态生效，畴壁宽度单位 a
read_ground_state = false       # true 优先读取 ground_state_file，覆盖上面的 initial_state
ground_state_file = auto        # auto：当前 engine/[band/]temperature/尺寸与边界/final_state.txt
reuse_states = true             # 优先读取对应 T/B/Ez 完整场点；缺失才计算
# 初态命令行选项优先于 read_ground_state，且 --random/--ground-state 等互斥。
# 要从头计算：reuse_states=false 或 --no-reuse，初态仍按上述规则选择。
# 切换 LLG/MC 后缓存目录隔离；要跨方法读取构型，请明确填写文件路径。

# ==================== 5. 温度/磁场/电场：空间均匀值 ====================
# 固定值：起止相同且 count=1；扫描：设置起止和 count>=2。
temperature_start_K = 200        # LLG 允许 T=0；MC 所有温度必须 >0
temperature_end_K = 0.1
temperature_count = 50
field_start_T = 0                # z 方向磁场，单位 T；LLG/MC 均使用
field_end_T = 0
field_count = 1
electric_start = 0               # 仅 LLG 生效，沿用原 Ez 单位约定
electric_end = 0
electric_count = 1
# MC 会将 electric_* 的实际值归零、点数归一，并在日志说明；仅扫描 T/B。
# 单场与 MC：按输入方向连续扫描。LLG 磁电联合：先纯磁场基底，再独立电场分支。
# LLG 联合扫描 B/Ez 按升序；已有完整点先读取，缺失才按每点预算计算。

# ==================== 6. LLG 专用：engine=llg 才生效 ====================
llg_kernel = optimized           # optimized 优化内核；reference 用于核对
damping = 0.5                   # Gilbert 阻尼，>=0
dt_fs = 0.1                     # 时间步长 fs，>0
relaxation_ps = 50               # 每点时间 ps；默认对应 500000 步
llg_steps = 0                   # 0 按时间/步长计算；>0 明确指定每点步数，覆盖 relaxation_ps
thermal_noise = true            # 同一步的预测/校正共用同一热场；T=0 时热场为零
# --steps N 优先于 llg_steps；MC 中请使用第 7 组，不使用 --steps。

# ==================== 7. MC 专用：engine=mc 才生效 ====================
equilibration_sweeps = 5000      # 每点平衡轮数，>=0；不计入测量接受率
measurement_sweeps = 10         # 每点测量轮数，>=1
proposal_sigma = 60             # 归一化前随机提议幅度，>0，沿用原 MC 默认值
# 一轮 sweep 每格点尝试更新一次，总轮数=平衡+测量；不同轮数不对应 LLG 物理时间。
# MC 温度直接进入 Metropolis 接受概率，不受 thermal_noise 开关影响。

# ==================== 8. CPU 资源：两种方法均使用 OpenMP ====================
cpu_threads = 0                 # >0 指定线程数；0 优先用单节点 PBS ppn，否则 OpenMP 默认值
# --threads 优先于本项，但不得超过 PBS 分配。PBS 不再强制覆盖本项为 ppn。

# ==================== 9. 输出、绘图、日志与检查点 ====================
output_dir = result             # 与本 INI/脚本同目录；result/材料/engine/[band/]场分类/尺寸与边界/
save_text = true                # 每点 TXT 和 final_state.txt；同时提供后续重绘/缓存
write_png = true                # 每点完成后用已有 Python 环境画原 LLG 风格彩色箭头图
python_executable = python      # --python > 明确解释器路径 > PBS 的 SPIN_PLOT_PYTHON > PATH
plot_script = render_snapshot.py
# 上面的绘图脚本与 INI 同在外层；C++ 源码与编译后的程序位于 program/。
# 用 run.sh/wz.pbs 启动时，标准输出/错误写入外层 配置名前缀_master_作业ID.out。
log_interval_seconds = 30
checkpoint_interval_seconds = 300
# LLG 在 64 步批次边界、MC 在 32 sweeps 批次边界响应日志/信号/检查点。
# 检查点保存构型与条件，不是包含随机数和全扫描状态的完整续算。
# 最终生效值见结果目录 run_settings.ini；summary.csv 的 unit 区分 steps/sweeps。
